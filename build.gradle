buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

allprojects {
    version = '2.0.2-RELEASE'
    ext.versionCode = 12
    ext.gdxVersion = '1.14.2'
    repositories {
        google()
        mavenCentral()
    }
}
